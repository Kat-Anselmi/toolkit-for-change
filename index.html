<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#5C2D91">
<title>Toolkit for Change</title>
<style>
:root{
  --ink:#1A0A2E; --ink2:#5A4A6E; --ink3:#9A8AB0;
  --bg:#F7F4FF; --card:#FFFFFF; --border:#E8E0FF;
  --w1:#0066CC; --w1l:#E6F0FF; --w1d:#004499;
  --w2:#00884A; --w2l:#E6F7EE; --w2d:#005A32;
  --w3:#7B2FBE; --w3l:#F5E8FF; --w3d:#4A1A8C;
  --spark:#FF6B00; --sparkl:#FFF0E6;
  --danger:#E5003C; --dangerl:#FFE6ED;
  --gold:#FFB800; --goodl:#E8FFF4; --good:#00884A;
  --r:20px; --r-sm:12px; --r-btn:50px;
  --shadow:0 4px 20px rgba(92,45,145,.12);
  --shadow-sm:0 2px 10px rgba(92,45,145,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;}
#root{max-width:420px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.screen{display:flex;flex-direction:column;height:100%;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.pad{padding:20px;}
.pad-sm{padding:12px 20px;}

/* Header */
.hdr{background:var(--card);padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--border);flex-shrink:0;}
.hdr-back{background:none;border:2px solid var(--border);border-radius:var(--r-btn);cursor:pointer;font-size:16px;color:var(--ink);padding:6px 14px;font-weight:700;}
.hdr-title{font-size:17px;font-weight:800;flex:1;color:var(--ink);}
.hdr-badge{font-size:11px;font-weight:700;padding:4px 12px;border-radius:var(--r-btn);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px;}

/* Buttons */
.btn{display:block;width:100%;padding:16px;border-radius:var(--r-btn);border:none;font-size:17px;font-weight:800;cursor:pointer;text-align:center;transition:transform .1s,opacity .1s;letter-spacing:.2px;}
.btn:active{transform:scale(.97);}
.btn-p{background:var(--w3);color:#fff;box-shadow:0 4px 16px rgba(123,47,190,.3);}
.btn-s{background:var(--card);color:var(--w3);border:2px solid var(--w3);}
.btn-spark{background:var(--spark);color:#fff;box-shadow:0 4px 16px rgba(255,107,0,.3);}
.btn-sm{font-size:14px;padding:11px 20px;}

/* Cards */
.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}

/* Spark mascot bubble */
.spark-bubble{background:var(--sparkl);border-radius:16px 16px 16px 4px;padding:14px 16px;margin-bottom:14px;border:2px solid var(--spark);display:flex;gap:12px;align-items:flex-start;}
.spark-icon{font-size:28px;flex-shrink:0;line-height:1;}
.spark-text{font-size:15px;line-height:1.5;color:var(--ink);}
.spark-text strong{color:var(--spark);}

/* Welcome hero */
.hero{background:var(--w3);padding:48px 24px 36px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:rgba(255,255,255,.06);border-radius:50%;}
.hero::after{content:'';position:absolute;bottom:-30px;left:-30px;width:120px;height:120px;background:rgba(255,255,255,.06);border-radius:50%;}
.hero h1{font-size:28px;font-weight:900;color:#fff;margin-bottom:8px;line-height:1.2;position:relative;z-index:1;}
.hero p{font-size:15px;color:rgba(255,255,255,.85);line-height:1.5;position:relative;z-index:1;}
.hero-spark{font-size:64px;margin-bottom:12px;display:block;position:relative;z-index:1;}
.hero-badge{display:inline-block;background:rgba(255,255,255,.2);color:#fff;font-size:12px;font-weight:700;padding:5px 14px;border-radius:var(--r-btn);margin-bottom:14px;position:relative;z-index:1;text-transform:uppercase;letter-spacing:.5px;}

/* Onboarding */
.ob-top{padding:20px;background:var(--card);border-bottom:2px solid var(--border);}
.ob-prog{height:8px;background:var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px;}
.ob-fill{height:100%;background:linear-gradient(90deg,var(--spark),var(--w3));border-radius:8px;transition:width .4s;}
.ob-step{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin-bottom:8px;}
.ob-q{font-size:21px;font-weight:900;color:var(--ink);line-height:1.3;}
.ob-sub{font-size:14px;color:var(--ink2);margin-top:4px;}

.opt-card{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;}
.opt-card:active{transform:scale(.98);}
.opt-card.sel{border-color:var(--w3);background:var(--w3l);}
.opt-icon{font-size:28px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:var(--r-sm);flex-shrink:0;}
.opt-card.sel .opt-icon{background:var(--w3l);}
.opt-label{font-size:15px;font-weight:600;line-height:1.3;color:var(--ink);}

/* Country input */
.geo-input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:var(--r);font-size:16px;font-family:inherit;outline:none;background:var(--card);color:var(--ink);transition:border-color .15s;font-weight:600;}
.geo-input:focus{border-color:var(--w3);}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.chip{padding:7px 14px;border-radius:var(--r-btn);border:2px solid var(--border);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2);transition:all .15s;}
.chip.sel{border-color:var(--w3);background:var(--w3l);color:var(--w3d);}
.chip:active{transform:scale(.96);}

/* Safety scale */
.safety-scale{display:flex;flex-direction:column;gap:10px;}
.safety-opt{border:2px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;}
.safety-opt:active{transform:scale(.98);}
.safety-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;}
.safety-opt-label{font-size:15px;font-weight:600;color:var(--ink);}
.safety-opt-sub{font-size:13px;color:var(--ink2);margin-top:2px;}
.safety-opt.sel{border-color:var(--ink);background:var(--bg);}

/* Profile result */
.profile-hero{padding:28px 20px;text-align:center;}
.profile-icon{font-size:56px;margin-bottom:10px;}
.profile-title{font-size:22px;font-weight:900;margin-bottom:8px;color:var(--ink);}
.profile-msg{font-size:15px;color:var(--ink2);line-height:1.6;}
.safety-warning{background:var(--dangerl);border:2px solid var(--danger);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;}
.sw-icon{font-size:22px;flex-shrink:0;}
.sw-text{font-size:14px;color:var(--ink);line-height:1.5;}

/* World map */
.world-header{background:var(--w3);padding:20px;color:#fff;}
.world-header h2{font-size:22px;font-weight:900;margin-bottom:4px;}
.world-header p{font-size:13px;opacity:.8;}
.world-card{background:var(--card);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow-sm);border:2px solid var(--border);cursor:pointer;transition:transform .15s;}
.world-card:active{transform:scale(.98);}
.world-banner{padding:18px 18px 12px;display:flex;align-items:center;gap:14px;}
.world-emoji{font-size:36px;}
.world-info{flex:1;}
.world-name{font-size:19px;font-weight:900;margin-bottom:2px;}
.world-sub{font-size:13px;color:var(--ink2);}
.world-footer{padding:10px 18px 14px;display:flex;align-items:center;justify-content:space-between;}
.world-progress{display:flex;gap:5px;align-items:center;}
.star{font-size:18px;}
.world-cta{font-size:13px;font-weight:700;padding:7px 16px;border-radius:var(--r-btn);border:none;cursor:pointer;}

/* Mission list */
.world-top{padding:18px;color:#fff;}
.world-top h2{font-size:20px;font-weight:900;margin-bottom:3px;}
.world-top p{font-size:13px;opacity:.85;}
.mission-card{background:var(--card);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm);border:2px solid var(--border);cursor:pointer;display:flex;align-items:stretch;transition:transform .15s;}
.mission-card:active{transform:scale(.98);}
.mission-left{width:64px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;}
.mission-body{flex:1;padding:14px 14px 14px 0;}
.mission-num{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);margin-bottom:2px;}
.mission-name{font-size:16px;font-weight:800;margin-bottom:3px;color:var(--ink);}
.mission-sub{font-size:13px;color:var(--ink2);}
.mission-star{padding:14px;display:flex;align-items:center;font-size:18px;}

/* Mission detail */
.mission-hero{padding:20px;color:#fff;}
.mission-hero-icon{font-size:44px;margin-bottom:8px;}
.mission-hero h2{font-size:20px;font-weight:900;margin-bottom:4px;}
.mission-hero p{font-size:13px;opacity:.85;}

/* Content cards */
.vcard{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);border-left:4px solid var(--danger);}
.vcard-title{font-size:16px;font-weight:800;margin-bottom:4px;color:var(--ink);}
.vcard-desc{font-size:14px;color:var(--ink2);line-height:1.5;}
.power-card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);border-left:4px solid var(--gold);}
.power-title{font-size:15px;font-weight:800;margin-bottom:3px;color:var(--ink);}
.power-law{font-size:12px;font-weight:700;color:var(--w3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px;}
.power-desc{font-size:14px;color:var(--ink2);line-height:1.5;}
.step-row{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);display:flex;gap:14px;align-items:flex-start;}
.step-bubble{width:32px;height:32px;border-radius:50%;background:var(--w3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0;margin-top:1px;}
.step-title{font-size:15px;font-weight:800;margin-bottom:3px;color:var(--ink);}
.step-desc{font-size:14px;color:var(--ink2);line-height:1.5;}
.warn-box{background:var(--dangerl);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;border:2px solid var(--danger);display:flex;gap:10px;}
.info-box{background:var(--w3l);border-radius:var(--r);padding:14px 16px;margin-top:10px;display:flex;gap:10px;}
.ctx-box{background:#FFF8E1;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;border:2px solid #F9A825;display:flex;gap:10px;font-size:14px;color:var(--ink2);line-height:1.5;}
.dot-item{display:flex;gap:10px;padding:4px 0;font-size:14px;color:var(--ink2);line-height:1.4;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px;}
.from-to{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.from-line{font-size:14px;color:var(--ink3);display:flex;gap:8px;margin-bottom:4px;}
.arrow-down{text-align:center;font-size:20px;color:var(--w2);margin:2px 0;}
.to-line{font-size:15px;font-weight:800;color:var(--w2d);display:flex;gap:8px;}
.ally-card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.ally-title{font-size:15px;font-weight:800;color:var(--w2d);margin-bottom:4px;}
.ally-role{font-size:14px;color:var(--ink2);line-height:1.5;}
.case-card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);opacity:.75;}
.diag-card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);border-top:3px solid var(--w3);}
.diag-q{font-size:15px;font-weight:800;color:var(--w3d);margin-bottom:8px;}
.diag-look{font-size:13px;color:var(--ink2);line-height:1.4;margin-bottom:4px;}
.fix-card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.fix-badge{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:4px 12px;border-radius:var(--r-btn);color:#fff;margin-bottom:8px;}
.fix-sub{font-size:13px;color:var(--ink2);font-style:italic;margin-bottom:8px;}
.fix-act{font-size:15px;color:var(--ink);line-height:1.5;margin-bottom:8px;}
.fix-who{font-size:13px;color:var(--ink2);}
.ev-item{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;}
.ev-name{font-size:13px;font-weight:800;color:var(--w3d);width:110px;flex-shrink:0;line-height:1.3;}
.ev-desc{font-size:13px;color:var(--ink2);line-height:1.4;}
.glos-item{border-bottom:1px solid var(--border);padding:12px 0;}
.glos-item:last-child{border:none;}
.glos-term{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:3px;}
.glos-def{font-size:14px;color:var(--ink2);line-height:1.5;}
.tpl-item{background:var(--w3l);border-radius:var(--r);padding:14px;margin-bottom:10px;border-left:4px solid var(--w3);}
.tpl-title{font-size:15px;font-weight:800;color:var(--w3d);margin-bottom:3px;}
.tpl-desc{font-size:14px;color:var(--ink2);}
.bad-list{background:var(--dangerl);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.good-list{background:var(--goodl);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.mini-item{display:flex;gap:8px;margin-bottom:7px;font-size:14px;color:var(--ink2);line-height:1.4;}
.mini-item:last-child{margin-bottom:0;}
.sec-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin:20px 0 10px;}

/* Tools */
.ttabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px;}
.ttab{padding:8px 16px;border-radius:var(--r-btn);border:2px solid var(--border);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink2);}
.ttab.act{border-color:var(--w1);background:var(--w1l);color:var(--w1d);}
.clitem{background:var(--card);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;cursor:pointer;border:2px solid var(--border);transition:all .15s;}
.clitem.chk{background:var(--goodl);border-color:var(--good);}
.chkbox{width:24px;height:24px;border:2px solid var(--border);border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;margin-top:1px;}
.chk .chkbox{background:var(--good);border-color:var(--good);color:#fff;}
.cltext{font-size:15px;line-height:1.4;font-weight:500;}
.dt-node{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-sm);}
.dt-q{font-size:18px;font-weight:800;margin-bottom:20px;line-height:1.3;text-align:center;color:var(--ink);}
.dt-btns{display:flex;gap:10px;}
.dt-btn{flex:1;padding:14px;border-radius:var(--r);border:2px solid;cursor:pointer;font-size:16px;font-weight:800;background:var(--card);transition:all .15s;}
.dt-y{border-color:var(--good);color:var(--good);}
.dt-y:active{background:var(--goodl);}
.dt-n{border-color:var(--danger);color:var(--danger);}
.dt-n:active{background:var(--dangerl);}
.dt-ans{background:var(--card);border-radius:var(--r);padding:24px;text-align:center;box-shadow:var(--shadow-sm);border-top:4px solid var(--w1);}
.dt-icon{font-size:40px;margin-bottom:12px;}
.dt-text{font-size:15px;color:var(--ink2);line-height:1.6;margin-bottom:18px;}
.script-card{background:var(--w1l);border-radius:var(--r);padding:18px;margin-bottom:12px;border-left:4px solid var(--w1);}
.script-lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--w1d);margin-bottom:8px;}
.script-txt{font-size:16px;font-weight:700;color:var(--w1d);line-height:1.4;font-style:italic;}

/* Plan builder */
.plan-cta{background:var(--w3);border-radius:var(--r);padding:22px;text-align:center;margin-top:8px;}
.plan-cta h3{font-size:18px;font-weight:900;color:#fff;margin-bottom:6px;}
.plan-cta p{font-size:14px;color:rgba(255,255,255,.85);margin-bottom:16px;line-height:1.4;}
.plan-cta button{background:#fff;color:var(--w3d);border:none;padding:12px 28px;border-radius:var(--r-btn);font-weight:900;cursor:pointer;font-size:16px;}
.plan-ctx{background:var(--w3l);padding:10px 18px;border-bottom:2px solid var(--w3);flex-shrink:0;display:flex;align-items:center;gap:8px;}
.plan-ctx span{font-size:13px;font-weight:700;color:var(--w3d);}
.chat-user{display:flex;justify-content:flex-end;margin-bottom:12px;}
.bubble-user{background:var(--w1);color:#fff;border-radius:20px 20px 4px 20px;padding:12px 16px;max-width:88%;font-size:15px;line-height:1.5;}
.chat-spark{display:flex;gap:10px;margin-bottom:16px;align-items:flex-start;}
.spark-av{width:34px;height:34px;border-radius:50%;background:var(--sparkl);border:2px solid var(--spark);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.bubble-spark{background:var(--card);border-radius:4px 20px 20px 20px;padding:14px 16px;box-shadow:var(--shadow-sm);flex:1;font-size:15px;line-height:1.6;border:1px solid var(--border);}
.loading-dots{display:flex;gap:5px;align-items:center;padding:4px 0;}
.dot-pulse{width:8px;height:8px;border-radius:50%;background:var(--spark);}
.chat-input-bar{background:var(--card);border-top:2px solid var(--border);padding:10px 14px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;}
.chat-ta{flex:1;padding:11px 14px;border:2px solid var(--border);border-radius:20px;font-size:15px;font-family:inherit;resize:none;outline:none;line-height:1.4;max-height:90px;overflow-y:auto;transition:border-color .15s;background:var(--bg);}
.chat-ta:focus{border-color:var(--w3);}
.send-btn{width:44px;height:44px;border-radius:50%;background:var(--w3);border:none;cursor:pointer;color:#fff;font-size:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(123,47,190,.3);}
.starter-chip{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:14px;color:var(--ink2);line-height:1.4;transition:all .15s;}
.starter-chip:active{background:var(--w3l);border-color:var(--w3);}

.bottom-safe{height:28px;flex-shrink:0;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fade{animation:fadeUp .2s ease;}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.7);}50%{opacity:1;transform:scale(1.2);}}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ── STATE ────────────────────────────────────────────────────────────────────
const S={
  screen:'welcome',step:0,answers:{},
  profile:null,world:null,mission:null,
  tool:'cl',checks:{},dtStep:'q1',
  planHistory:{},planLoading:false,visited:{}
};

// ── DATA ─────────────────────────────────────────────────────────────────────
const COUNTRIES=['Brazil','India','Indonesia','Kenya','Mexico','Nigeria','Philippines','South Africa','UK','USA'];
const OB=[
  {id:'reason',q:"What's happening in your life right now?",opts:[
    {v:'myself',l:"I've been stopped, questioned, or detained",i:'🚨'},
    {v:'support',l:"A friend or family member has — I want to help",i:'🤝'},
    {v:'prepare',l:"Nothing yet — I want to know my rights",i:'📖'},
    {v:'change',l:"I want to change how the system works",i:'✊'}
  ]},
  {id:'geo',q:"Where are you?",sub:"This helps us give you information specific to your country.",geo:true},
  {id:'safety',q:"How free do you feel to speak up where you are?",safety:true},
  {id:'urgency',q:"What do you need most right now?",opts:[
    {v:'now',l:"Help right now — something is happening",i:'🔥'},
    {v:'prepare',l:"I'm preparing — nothing has happened yet",i:'🛡️'},
    {v:'support',l:"I'm helping someone else through this",i:'💙'},
    {v:'change',l:"I'm here for the big picture — system change",i:'🌍'}
  ]}
];

function buildProfile(a){
  if(a.urgency==='now')return{i:'🚨',title:"Let's focus on right now",msg:"Something is happening. Start with World 1 — it has the tools you need immediately.",rec:1,safe:a.safety==='risk'||a.safety==='care'};
  if(a.safety==='risk')return{i:'🔴',title:"Your safety comes first",msg:"Some actions in this toolkit may not be safe in your context. Start with World 1 — understanding your rights — and stick to private, safe actions for now.",rec:1,safe:true};
  if(a.reason==='change'&&(a.safety==='very'||a.safety==='some'))return{i:'✊',title:"Ready to drive change",msg:"You're here to make a difference. Start with World 1 to ground yourself, then move to World 3 where the system-change tools live.",rec:1,safe:false};
  if(a.reason==='support')return{i:'💙',title:"Let's help you support someone",msg:"World 1 explains what should have happened and what rights apply. World 2 has tools built specifically for supporting others.",rec:1,safe:false};
  return{i:'📖',title:"Great starting point",msg:"Start with World 1 to understand your rights. Worlds 2 and 3 will take you further when you're ready.",rec:1,safe:false};
}

        ${w.missions.map(mn=>{
          const m=MISSIONS[mn];
          const done=S.visited[mn];
          return `<div class="mission-card" onclick="go('mission',${mn})" style="${done?`border-color:${w.hex}`:''}" >
            <div class="mission-left" style="background:${w.lhex}">${m.emoji}</div>
            <div class="mission-body">
              <div class="mission-num">Mission ${mn}</div>
              <div class="mission-name">${m.name}</div>
              <div class="mission-sub">${m.sub}</div>
            </div>
            <div class="mission-star">${done?'⭐':'☆'}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="bottom-safe"></div>
    </div>
  </div>`);
}

function showMission(n){
  const m=MISSIONS[n];
  const w=WORLDS[m.w];
  S.visited[n]=true;
  const hasPlan=S.planHistory[n]&&S.planHistory[n].length>0;
  rdr(`<div class="screen">
    <div class="hdr">
      <button class="hdr-back" onclick="go('world',${m.w})">← ${w.name}</button>
      <div class="hdr-title">${m.name}</div>
      <div class="hdr-badge" style="background:${w.lhex};color:${w.hex}">M${n}</div>
    </div>
    <div class="mission-hero" style="background:${w.hex}">
      <div class="mission-hero-icon">${m.emoji}</div>
      <h2>${m.name}</h2>
      <p>${m.sub}</p>
    </div>
    <div class="scroll">
      <div class="pad">
        ${missionBody(m,n,w)}
        <div class="plan-cta">
          <h3>${hasPlan?'📋 Continue your plan':'✨ Build your action plan'}</h3>
          <p>${hasPlan?'You have a plan in progress — continue where you left off.':'Get step-by-step guidance for your specific situation.'}</p>
          <button onclick="go('plan',${n})">${hasPlan?'Continue →':'Build my plan →'}</button>
        </div>
      </div>
      <div class="bottom-safe"></div>
    </div>
  </div>`);
}

function missionBody(m,n,w){
  if(m.type==='violations')return`
    <div class="spark-bubble"><span class="spark-icon">⚡</span><div class="spark-text">${m.intro}</div></div>
    ${m.items.map(i=>`<div class="vcard"><div class="vcard-title">🚩 ${i.t}</div><div class="vcard-desc">${i.d}</div></div>`).join('')}
    <div class="info-box"><span>📝</span><span style="font-size:14px;color:var(--ink2);line-height:1.5;">${m.note}</span></div>`;
  if(m.type==='rights')return`
    <div class="spark-bubble"><span class="spark-icon">⚡</span><div class="spark-text">${m.intro}</div></div>
    ${m.items.map(i=>`<div class="power-card"><div class="power-title">⭐ ${i.r}</div><div class="power-law">${i.l}</div><div class="power-desc">${i.d}</div></div>`).join('')}`;
  if(m.type==='steps')return`
    <div class="spark-bubble"><span class="spark-icon">⚡</span><div class="spark-text">${m.intro}</div></div>
    ${m.items.map(i=>`<div class="step-row"><div class="step-bubble">${i.n}</div><div><div class="step-title">${i.t}</div><div class="step-desc">${i.d}</div></div></div>`).join('')}`;
  if(m.type==='safety')return`
    <div class="warn-box"><span>⚠️</span><span style="font-size:14px;line-height:1.5;">${m.warning}</span></div>
    <div class="spark-bubble"><span class="spark-icon">⚡</span><div class="spark-text">${m.intro}</div></div>
    ${m.secs.map(s=>`<div style="margin-bottom:16px;"><div style="font-size:15px;font-weight:800;margin-bottom:8px;">${s.t}</div>${s.items.map(i=>`<div class="dot-item"><div class="dot" style="background:var(--w1)"></div><span>${i}</span></div>`).join('')}</div>`).join('')}`;
  if(m.type==='tools')return toolsBody(m);
  if(m.type==='framing')return`
    <div class="spark-bubble"><span class="spark-icon">⚡</span><div class="spark-text">${m.intro}</div></div>
    ${m.items.map(i=>`<div class="from-to"><div class="from-line"><span>✗</span><span>${i.f}</span></div><div class="arrow-down">↓</div><div class="to-line"><span style="color:var(--good)">✓</span><span>${i.t}</span></div></div>`).join('')}`;
  if(m.type==='partners')return`
    <div class="spark-bubble"><span class="spark-icon">⚡</span><div class="spark-text">${m.intro}</div></div>
    ${m.items.map(i=>`<div class="ally-card"><div class="ally-title">🤝 ${i.t}</div><div class="ally-role">${i.r}</div></div>`).join('')}
    <div class="info-box"><span>💡</span><span style="font-size:14px;color:var(--ink2);line-height:1.5;">${m.tip}</span></div>`;
  if(m.type==='cases')return`
    <div class="spark-bubble"><span class="spark-icon">⚡</span><div class="spark-text">${m.intro}</div></div>
    ${m.items.map(i=>`<div class="case-card"><div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);margin-bottom:4px;">${i.country}</div><div style="font-size:16px;font-weight:800;margin-bottom:5px;">${i.t}</div><div style="font-size:14px;color:var(--ink2);line-height:1.5;">${i.p}</div></div>`).join('')}`;
  if(m.type==='diagnosis')return`
    <div class="spark-bubble"><span class="spark-icon">⚡</span><div class="spark-text">${m.intro}</div></div>
    <div class="sec-label">🔍 Questions to investigate</div>
    ${m.qs.map(q=>`<div class="diag-card"><div class="diag-q">${q.q}</div><div class="diag-look"><strong>Look for:</strong> ${q.look}</div><div class="diag-look" style="color:var(--danger);margin-top:4px;"><strong>If it doesn't exist:</strong> ${q.ifnot}</div></div>`).join('')}
    <div class="sec-label">Common gaps</div>
    <div class="bad-list">${m.gaps.map(g=>`<div class="mini-item"><span style="color:var(--danger)">✗</span><span>${g}</span></div>`).join('')}</div>
    <div class="sec-label">Signs of progress</div>
    <div class="good-list">${m.progress.map(p=>`<div class="mini-item"><span style="color:var(--good)">✓</span><span>${p}</span></div>`).join('')}</div>`;
  if(m.type==='levers')return`
    <div class="spark-bubble"><span class="spark-icon">⚡</span><div class="spark-text">${m.intro}</div></div>
    <div class="warn-box"><span>⚠️</span><span style="font-size:14px;line-height:1.5;">${m.warn}</span></div>
    <div class="ctx-box"><span>🌍</span><span>${m.ctx}</span></div>
    ${m.fixes.map(f=>`<div class="fix-card"><div class="fix-badge" style="background:${f.cls}">${f.type}</div><div class="fix-sub">${f.sub}</div><div class="fix-act">${f.act}</div>${f.note?`<div style="font-size:13px;color:var(--ink2);font-style:italic;margin-bottom:8px;">${f.note}</div>`:''}<div class="fix-who"><strong>Who to ask:</strong> ${f.who}</div></div>`).join('')}`;
  if(m.type==='evidence')return`
    <div class="spark-bubble"><span class="spark-icon">⚡</span><div class="spark-text">${m.intro}</div></div>
    <div class="sec-label">📜 International standards to cite</div>
    ${m.stds.map(s=>`<div class="ev-item"><div class="ev-name">${s.n}</div><div class="ev-desc">${s.d}</div></div>`).join('')}
    <div class="sec-label">📖 Glossary</div>
    <div class="card">${m.glos.map(g=>`<div class="glos-item"><div class="glos-term">${g.t}</div><div class="glos-def">${g.d}</div></div>`).join('')}</div>
    <div class="sec-label">📄 Templates</div>
    ${m.tpls.map(t=>`<div class="tpl-item"><div class="tpl-title">${t.t}</div><div class="tpl-desc">${t.d}</div></div>`).join('')}`;
  return'';
}

function toolsBody(m){
  const t=S.tool;
  return`<div class="spark-bubble"><span class="spark-icon">⚡</span><div class="spark-text">${m.intro}</div></div>
    <div class="ttabs">
      <div class="ttab${t==='cl'?' act':''}" onclick="switchTool('cl')">✅ Checklist</div>
      <div class="ttab${t==='dt'?' act':''}" onclick="switchTool('dt')">🌳 What do I do?</div>
      <div class="ttab${t==='sc'?' act':''}" onclick="switchTool('sc')">💬 What to say</div>
      <div class="ttab${t==='gl'?' act':''}" onclick="switchTool('gl')">📖 Key words</div>
    </div>
    <div id="tc">${toolContent(t)}</div>`;
}

function toolContent(t){
  if(t==='cl')return`
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">Quick Checklist</div>
    <div style="font-size:14px;color:var(--ink2);margin-bottom:14px;">Tap to check off. Use this in real time.</div>
    ${CL_ITEMS.map((item,i)=>`<div class="clitem${S.checks[i]?' chk':''}" onclick="chk(${i})">
      <div class="chkbox">${S.checks[i]?'✓':''}</div>
      <div class="cltext">${item}</div>
    </div>`).join('')}
    <div style="height:10px;"></div>
    <button class="btn btn-s btn-sm" onclick="resetCl()">Reset</button>`;
  if(t==='dt'){
    const node=DT[S.dtStep];const ans=DTA[S.dtStep];
    if(ans)return`<div style="font-size:16px;font-weight:800;margin-bottom:14px;">What do I do right now?</div>
      <div class="dt-ans"><div class="dt-icon">${ans.i}</div><div class="dt-text">${ans.t}</div>
      <button class="btn btn-p btn-sm" onclick="dtGo('${ans.nx}')">${ans.btn}</button></div>`;
    return`<div style="font-size:16px;font-weight:800;margin-bottom:14px;">What do I do right now?</div>
      <div class="dt-node"><div class="dt-q">${node.q}</div>
      <div class="dt-btns"><button class="dt-btn dt-y" onclick="dtGo('${node.y}')">Yes ✓</button>
      <button class="dt-btn dt-n" onclick="dtGo('${node.n}')">No ✗</button></div></div>`;
  }
  if(t==='sc')return`
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">What to say</div>
    <div style="font-size:14px;color:var(--ink2);margin-bottom:14px;">Exact words. Say them clearly and calmly.</div>
    ${SCRIPTS.map(s=>`<div class="script-card"><div class="script-lbl">${s.l}</div><div class="script-txt">"${s.t}"</div></div>`).join('')}`;
  if(t==='gl'){
    const terms=[{t:"Free legal aid",d:"A free lawyer from the state — when you can't afford one."},{t:"Diversion",d:"Handling your case without going to court — through community support or a programme."},{t:"SOP",d:"Standard Operating Procedure — the written rules officers must follow."},{t:"Pre-trial detention",d:"Being held before a trial. Different from being sentenced."},{t:"Duty lawyer",d:"A lawyer on call at police stations — free of charge."}];
    return`<div style="font-size:16px;font-weight:800;margin-bottom:4px;">Key words explained</div>
      <div style="font-size:14px;color:var(--ink2);margin-bottom:14px;">Plain language. No jargon.</div>
      <div class="card">${terms.map(g=>`<div class="glos-item"><div class="glos-term">${g.t}</div><div class="glos-def">${g.d}</div></div>`).join('')}</div>`;
  }
  return'';
}

// ── PLAN BUILDER ─────────────────────────────────────────────────────────────
function planPrompt(n){
  const m=MISSIONS[n];const w=WORLDS[m.w];
  const loc=[S.answers.country,S.answers.city].filter(Boolean).join(', ');
  const safetyCtx={very:'The user feels safe to speak up publicly.',some:'The user is somewhat safe but needs to be careful.',care:'CAUTION: The user needs to be cautious — speaking up could have consequences.',risk:'SAFETY PRIORITY: Speaking up could put this user at real risk. Only suggest safe, private, or anonymous actions.'}[S.answers.safety]||'Safety context unknown — be cautious.';
  const urgencyCtx={now:'Something is happening RIGHT NOW — give immediate practical steps first.',prepare:'Preparing in advance — has time to plan.',support:'Helping someone else — focus on support and accompaniment.',change:'Seeking systemic change — focus on advocacy and coalition-building.'}[S.answers.urgency]||'Not specified.';
  const elGuides={1:'Help document and respond to a rights violation at first contact.',2:'Help understand which rights apply and build a personal reference for their situation.',3:'Help identify what should have happened and what they can do if it did not.',4:'Help build a personal safety plan — what to say, do, and document.',5:'Help use the checklist, decision tree, and scripts for their specific situation.',6:'Help identify concrete ways to contribute to changing first-contact practices locally.',7:'Help identify the right people and organisations to contact for their situation.',8:'Help understand how their experience compares to documented cases and what to do.',9:'Help create a research plan for investigating first-contact procedures in their context.',10:'Help identify which fix is achievable in their context and build a concrete campaign plan.',11:'Help gather the specific evidence and documentation they need.'};
  return`You are Spark ⚡ — a warm, direct, knowledgeable guide helping a young person build a personal action plan. You are part of the Toolkit for Change, grounded in the UN Convention on the Rights of the Child (CRC).

MODULE: Module 1 — First Contact
CURRENT MISSION: Mission ${n} — ${m.name} (${m.sub})
WORLD: World ${m.w} — ${w.name} (${w.sub})
USER LOCATION: ${loc||'Not specified'}
SAFETY LEVEL: ${safetyCtx}
URGENCY: ${urgencyCtx}
REASON HERE: ${{myself:'Personally stopped or detained.',support:'Supporting someone else.',prepare:'Preparing in advance.',change:'Driving systemic change.'}[S.answers.reason]||'Not specified.'}

YOUR TASK: ${elGuides[n]||'Build a personalised action plan.'}

${loc?`LOCATION CONTEXT: The user is in ${loc}. Where you know it, reference relevant local laws, organisations, or procedures. If you don't know specifics for this location, acknowledge this honestly and recommend they search for local legal aid organisations or contact UNICEF's country office.`:''}

STYLE:
- You are Spark — friendly, direct, not preachy
- Short sentences. Plain language.
- When using a legal term, explain it simply in brackets: e.g. diversion (handling your case without going to court)
- Bullet points, not paragraphs
- Realistic about what's actually possible

PLAN FORMAT:
**Right now** — 1–3 immediate steps
**In the next few days** — short-term steps  
**When you're ready** — longer-term steps
**Who can help** — specific contacts or types of organisations

RULES:
1. Never give formal legal advice — always say to seek a real lawyer or advocate
2. Safety first always — if risk level is cautious or at-risk, flag this and adapt
3. If the situation is unclear, ask ONE clarifying question before giving the plan
4. End every plan with: "This is a starting point — a local lawyer or advocate can adapt it to your exact situation."
5. Keep it real — not everything is possible everywhere`;
}

function md(text){
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/^### (.+)$/gm,'<div style="font-size:14px;font-weight:800;margin:12px 0 4px;">$1</div>')
    .replace(/^## (.+)$/gm,'<div style="font-size:15px;font-weight:800;margin:14px 0 6px;">$1</div>')
    .replace(/^# (.+)$/gm,'<div style="font-size:16px;font-weight:800;margin:16px 0 8px;">$1</div>')
    .replace(/^- (.+)$/gm,'<div style="display:flex;gap:8px;padding:2px 0"><span style="color:var(--w3);flex-shrink:0">•</span><span>$1</span></div>')
    .replace(/^\d+\. (.+)$/gm,'<div style="display:flex;gap:8px;padding:2px 0"><span style="color:var(--w3);font-weight:700;flex-shrink:0">›</span><span>$1</span></div>')
    .replace(/\n\n/g,'<div style="height:8px"></div>')
    .replace(/\n/g,'<br>');
}

function showPlan(n){
  const m=MISSIONS[n];const w=WORLDS[m.w];
  const hist=S.planHistory[n]||[];const loading=S.planLoading;
  rdr(`<div class="screen">
    <div class="hdr">
      <button class="hdr-back" onclick="go('mission',${n})">← ${m.name}</button>
      <div class="hdr-title">My Plan</div>
      ${hist.length>0?`<button onclick="clearPlan(${n})" style="background:none;border:none;color:var(--ink3);font-size:13px;cursor:pointer;font-weight:700;">Clear</button>`:''}
    </div>
    <div class="plan-ctx">
      <span>${m.emoji}</span>
      <span>Plan for: ${m.name}</span>
    </div>
    <div class="scroll" id="cs">
      <div class="pad" id="ca">
        ${hist.length===0?planStarter(n):chatMsgs(hist)}
        ${loading?loadingBubble():''}
      </div>
      <div class="bottom-safe"></div>
    </div>
    ${(hist.length>0&&!loading)?chatBar(n):''}
  </div>`);
  setTimeout(()=>{const el=document.getElementById('cs');if(el)el.scrollTop=el.scrollHeight;},150);
}

function planStarter(n){
  const m=MISSIONS[n];
  const starters=(PLAN_STARTERS[n]||PLAN_STARTERS[1]);
  return`<div style="text-align:center;padding:16px 0 12px;">
    <div style="font-size:44px;margin-bottom:10px;">⚡</div>
    <div style="font-size:18px;font-weight:900;margin-bottom:6px;color:var(--ink);">Build your personal plan</div>
    <div style="font-size:14px;color:var(--ink2);line-height:1.5;">Tell Spark what's going on and get a step-by-step plan for <strong>${m.name.toLowerCase()}</strong>.</div>
  </div>
  <div class="card" style="margin-bottom:12px;">
    <div style="font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px;">What's your situation?</div>
    <textarea id="fmsg" rows="3" placeholder="Describe what happened or what you're preparing for..."
      style="width:100%;padding:12px;border:2px solid var(--border);border-radius:var(--r-sm);font-size:15px;font-family:inherit;resize:none;line-height:1.5;outline:none;transition:border-color .15s;background:var(--bg);"
      onfocus="this.style.borderColor='var(--w3)'" onblur="this.style.borderColor='var(--border)'"></textarea>
    <div style="height:10px;"></div>
    <button class="btn btn-spark" onclick="sendFirst(${n})">Build my plan →</button>
  </div>
  <div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);margin-bottom:8px;">Or pick a starter</div>
  ${starters.map(s=>`<div class="starter-chip" onclick="fillStart('${s.replace(/'/g,"\\'")}')">💬 ${s}</div>`).join('')}
  <div style="font-size:12px;color:var(--ink3);text-align:center;margin-top:12px;">Your conversation is not stored beyond this session.</div>`;
}

function fillStart(t){const ta=document.getElementById('fmsg');if(ta){ta.value=t;ta.focus();}}

function chatMsgs(hist){
  return hist.map(m=>m.role==='user'
    ?`<div class="chat-user"><div class="bubble-user">${m.content.replace(/</g,'&lt;')}</div></div>`
    :`<div class="chat-spark"><div class="spark-av">⚡</div><div class="bubble-spark">${md(m.content)}</div></div>`
  ).join('');
}

function loadingBubble(){
  return`<div class="chat-spark"><div class="spark-av">⚡</div>
    <div class="bubble-spark"><div class="loading-dots">
      <span class="dot-pulse" style="animation:pulse .9s ease-in-out infinite;"></span>
      <span class="dot-pulse" style="animation:pulse .9s ease-in-out .25s infinite;"></span>
      <span class="dot-pulse" style="animation:pulse .9s ease-in-out .5s infinite;"></span>
    </div></div></div>`;
}

function chatBar(n){
  return`<div class="chat-input-bar">
    <textarea id="cinput" rows="1" placeholder="Ask a follow-up or refine your plan..."
      class="chat-ta"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg(${n});}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,90)+'px'"></textarea>
    <button class="send-btn" onclick="sendMsg(${n})">↑</button>
  </div>`;
}

async function sendFirst(n){
  const ta=document.getElementById('fmsg');if(!ta)return;
  const msg=ta.value.trim();if(!msg){ta.style.borderColor='var(--danger)';ta.focus();return;}
  if(!S.planHistory[n])S.planHistory[n]=[];
  S.planHistory[n].push({role:'user',content:msg});
  S.planLoading=true;showPlan(n);await runPlan(n);
}
async function sendMsg(n){
  const ta=document.getElementById('cinput');if(!ta)return;
  const msg=ta.value.trim();if(!msg)return;
  S.planHistory[n].push({role:'user',content:msg});
  S.planLoading=true;showPlan(n);await runPlan(n);
}
async function runPlan(n){
  try{
    const resp = await fetch("/api/claude", {
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:planPrompt(n),
        messages:S.planHistory[n].map(m=>({role:m.role,content:m.content}))})
    });
    if(!resp.ok)throw new Error(resp.status);
    const data=await resp.json();
    S.planHistory[n].push({role:'assistant',content:data.content[0].text});
  }catch(e){
    S.planHistory[n].push({role:'assistant',content:"Something went wrong — please try again. Check your internet connection and try once more."});
  }
  S.planLoading=false;showPlan(n);
}
function clearPlan(n){S.planHistory[n]=[];showPlan(n);}

// ── NAV ───────────────────────────────────────────────────────────────────────
function go(screen,param){
  S.screen=screen;
  if(screen==='welcome')showWelcome();
  else if(screen==='ob'){S.step=0;S.answers={};S.profile=null;showOB();}
  else if(screen==='profile')showProfile();
  else if(screen==='worlds')showWorlds();
  else if(screen==='world'){S.world=param;showWorld(param);}
  else if(screen==='mission'){S.mission=param;S.dtStep='q1';showMission(param);}
  else if(screen==='plan'){showPlan(param);}
}
function pick(id,val){S.answers[id]=val;showOB();}
function pickCountry(c){S.answers.country=c;const i=document.getElementById('country-in');if(i)i.value=c;showOB();}
function obNext(){
  if(S.step<OB.length-1){S.step++;showOB();}
  else{S.profile=buildProfile(S.answers);go('profile');}
}
function switchTool(t){S.tool=t;showMission(S.mission);}
function chk(i){S.checks[i]=!S.checks[i];showMission(S.mission);}
function resetCl(){S.checks={};showMission(S.mission);}
function dtGo(step){S.dtStep=step;showMission(S.mission);}

// ── INIT ──────────────────────────────────────────────────────────────────────
showWelcome();
</script>
</body>
</html>
